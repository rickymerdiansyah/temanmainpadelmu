<script>
const LOGO_SRC='data:image/webp;base64,__LOGO__';
const KEY='tmp.v2';
const FORMATS={
  'americano':{label:'Americano',group:'Americano',family:'americano',kind:'ind',desc:'Main bareng dan melawan semua orang secara bergiliran. Skor dihitung per pemain.'},
  'team-americano':{label:'Team Americano',group:'Americano',family:'americano',kind:'team',desc:'Tim tetap. Setiap tim bergiliran melawan semua tim lain.'},
  'mix-americano':{label:'Mix Americano',group:'Americano',family:'americano',kind:'mix',desc:'Pasangan campuran putra dan putri, partner berganti tiap ronde.'},
  'mexicano':{label:'Mexicano',group:'Mexicano',family:'mexicano',kind:'ind',mex:true,desc:'Ronde 1 acak, lalu lawan diseimbangkan berdasarkan klasemen: peringkat 1 & 4 melawan 2 & 3.'},
  'team-mexicano':{label:'Team Mexicano',group:'Mexicano',family:'mexicano',kind:'team',mex:true,desc:'Tim tetap. Tim dengan peringkat berdekatan saling bertemu tiap ronde.'},
  'mixicano':{label:'Mixicano',group:'Mexicano',family:'mexicano',kind:'mix',mex:true,desc:'Pasangan campuran, lawan diseimbangkan berdasarkan klasemen putra dan putri.'},
  'koth':{label:'King of the Court',group:'King of the Court',family:'koth',kind:'ind',koth:true,desc:'Pemenang naik lapangan, yang kalah turun. Menang di lapangan atas memberi bonus poin.'}
};
const TOTALS={point:[16,21,24,32,0],normal:[4,5,6,7,8,0]};
const MIN_PER_ROUND=15,MAX_COURTS=99;

let S={tournaments:[],wheels:[],hideHint:false,seeded:false};
let view='home',prevView='home',curId=null,curWheel=null,tab='rounds',selRound=0,draft=null,formErr='',editingId=null,menuOpen=false,confirmKey=null,extraN=1,sim=null,sheetKind=null,rosterDirty=false,spin=null;

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;
const courtName=i=>i<26?String.fromCharCode(65+i):String(i+1);
const grpName=g=>'Grup '+String.fromCharCode(65+g);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){localSave();Cloud.schedule();if(typeof Live!=='undefined')Live.schedule();}

/* ---------- Cloud save: keeps tournaments in the viewer's own private space on their Claude account ---------- */
const Cloud={db:null,uid:null,status:'local',synced:{},metaSynced:null,timer:null,chain:Promise.resolve(),
  set(st){this.status=st;paintCloud();},
  base(){return this.db.doc('data/users/'+this.uid+'/app');},
  async init(){
    try{
      if(!window.claude||!window.claude.use){this.set('device');return;}
      this.set('connecting');
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const uid=user?await user.id():null;
      if(!db||!uid){this.set('local');return;}
      this.db=db;this.uid=uid;
      await this.pull(true);
    }catch(e){this.set('local');}
  },
  async pull(first){
    if(!this.db)return;
    this.set('syncing');
    try{
      const [m,q]=await Promise.all([this.base().get(),this.base().collection('t').get()]);
      let meta=null;try{meta=m.exists?JSON.parse(m.data().json):null;}catch(e){}
      const remote={},raw={};
      q.docs.forEach(d=>{try{const v=d.data();remote[d.id]=JSON.parse(v.json);raw[d.id]=v.json;}catch(e){}});
      const before=JSON.stringify(S.tournaments);
      const tomb=new Set([...(meta&&meta.deleted||[]),...(S.deleted||[])]);
      const local={};S.tournaments.forEach(t=>local[t.id]=t);
      const out=[];
      for(const id of new Set([...Object.keys(remote),...Object.keys(local)])){
        if(tomb.has(id))continue;
        const r=remote[id],l=local[id];
        if(r&&l)out.push((l.updated||0)>(r.updated||0)?l:r);
        else if(r)out.push(r);
        else if(!(l.sample&&meta))out.push(l);
      }
      S.tournaments=out;S.deleted=[...tomb].slice(-300);
      if(meta){
        const wl={};(S.wheels||[]).forEach(w=>wl[w.id]=w);(meta.wheels||[]).forEach(w=>wl[w.id]=w);
        S.wheels=Object.values(wl).filter(w=>!tomb.has(w.id));
        S.hideHint=S.hideHint||!!meta.hideHint;S.seeded=true;
        if(first&&meta.last&&!S.last)S.last=meta.last;
      }
      migrate();
      this.synced={};for(const id in raw)this.synced[id]=tomb.has(id)?'':raw[id];
      this.metaSynced=meta?m.data().json:null;
      localSave();
      if(JSON.stringify(S.tournaments)!==before)onRemoteData(first);
      else if(first)onRemoteData(first,true);
      await this.flush();
    }catch(e){this.set('error');}
  },
  async flush(){
    if(!this.db)return;
    this.set('syncing');
    try{
      const col=this.base().collection('t'),seen={};
      for(const t of S.tournaments){
        seen[t.id]=1;
        if(this.synced[t.id]===JSON.stringify(t))continue;
        t.updated=Date.now();const j=JSON.stringify(t);
        await col.doc(t.id).set({json:j,updated:t.updated,name:String(t.name).slice(0,120)});
        this.synced[t.id]=j;
      }
      for(const id of Object.keys(this.synced))if(!seen[id]){await col.doc(id).delete();delete this.synced[id];}
      const mj=JSON.stringify({wheels:S.wheels||[],hideHint:!!S.hideHint,seeded:true,deleted:S.deleted||[],last:S.last||null});
      if(mj!==this.metaSynced){await this.base().set({json:mj});this.metaSynced=mj;}
      localSave();this.set('cloud');
    }catch(e){
      const c=e&&e.code;
      this.set(c==='invalid_argument'||c==='not_granted'||c==='revoked'?'readonly':c==='quota_exceeded'?'full':'error');
    }
  },
  schedule(ms){if(!this.db)return;clearTimeout(this.timer);this.timer=setTimeout(()=>{this.chain=this.chain.then(()=>this.flush());},ms===undefined?800:ms);},
  refresh(){if(!this.db)return;clearTimeout(this.timer);this.chain=this.chain.then(()=>this.flush()).then(()=>this.pull(false));}
};
const CLOUD_TXT={device:'Tersimpan di HP ini',local:'Hanya di perangkat ini',connecting:'Menghubungkan…',syncing:'Menyimpan…',cloud:'Tersimpan di akun',error:'Gagal menyimpan, dicoba lagi',readonly:'Tidak bisa menyimpan ke akun',full:'Penyimpanan akun penuh'};
function paintCloud(){
  const el=document.getElementById('cloudchip');if(el){el.className='cloud '+Cloud.status;el.innerHTML=`<i></i>${CLOUD_TXT[Cloud.status]||''}`;}
  const n=document.getElementById('cloudnote');if(n)n.hidden=!(Cloud.status==='local'||Cloud.status==='readonly');
}
let userNavigated=false;
function onRemoteData(first,unchanged){
  if(first&&!userNavigated&&view==='home')restoreLast();
  if(unchanged&&!(first&&view==='tour'))return;
  if(view==='create'||view==='wheel'||sheetKind)return;
  if(view==='tour'&&!cur())view='home';
  render();
}
function restoreLast(){const l=S.last;if(l&&S.tournaments.find(t=>t.id===l.id)){curId=l.id;tab=l.tab==='board'?'board':'rounds';selRound=+l.selRound||0;view='tour';}}
function rememberView(){
  if(view==='live')return;
  const l=view==='tour'&&curId?{id:curId,tab,selRound}:null;
  if(JSON.stringify(l)!==JSON.stringify(S.last||null)){S.last=l;save();}
}
let liveT=null,liveViewId=null,liveState='connecting',liveFollow=true;
const STANDALONE=!window.claude;
function cur(){if(view==='live')return liveT;return S.tournaments.find(t=>t.id===curId);}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,Math.min(7000,2400+String(msg).length*35));}
function fmtDate(d){try{return new Date(d).toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
function nowLocal(){const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:00`;}
/* How standings points are counted: 'games' = every game/point scored counts (classic Americano), 'match' = win/draw/loss points */
const matchPts=t=>t.scoring==='gs';
function ptsLabel(t){return matchPts(t)?`Menang ${t.gsWin} · seri ${t.gsDraw} · kalah 0`:(t.scoring==='point'?'Total poin yang dicetak':'Total game yang dimenangkan');}
function totalLabel(t){if(t.scoring==='gs')return 'Games & Sets';if(!t.total)return t.scoring==='point'?'Poin bebas':'Game bebas';return t.scoring==='point'?t.total+' poin per match':'Total '+t.total+' game';}
function unitWord(t){return FORMATS[t.type].kind==='team'?'tim':'pemain';}
function parseNames(text,team){return text.split(/[\n;]+/).flatMap(s=>team?[s]:s.split(',')).map(s=>s.replace(/^\s*\d+\s*[.)\-]\s*/,'').replace(/^[-•*]\s*/,'').trim()).filter(Boolean).map(s=>s.slice(0,48));}

/* ---------- Groups, attendance, sizes ---------- */
const G=t=>Math.max(1,+t.groups||1);
function groupCourts(t,g){const n=G(t),base=Math.floor(t.courts/n),rem=t.courts%n;return base+(g<rem?1:0);}
function courtOffset(t,g){let o=0;for(let i=0;i<g;i++)o+=groupCourts(t,i);return o;}
function present(t){return t.entries.filter(e=>!e.away);}
function genView(t,g){
  const ents=t.entries.filter(e=>!e.away&&(G(t)===1||(e.grp||0)===g)),off=courtOffset(t,g);
  const rounds=t.rounds.map(r=>{const ms=r.matches.filter(m=>(m.grp||0)===g).map(m=>({...m,court:m.court-off}));const inM=new Set(ms.flatMap(m=>[...m.a,...m.b]));return {matches:ms,bye:ents.map(e=>e.id).filter(id=>!inM.has(id))};});
  return {...t,entries:ents,courts:groupCourts(t,g),rounds,groups:1};
}
function counts(v){const m=v.entries.filter(e=>e.g==='M').length;return {n:v.entries.length,m,f:v.entries.length-m};}
function perRound(v){
  const K=FORMATS[v.type].kind,{n,m,f}=counts(v);
  if(K==='team')return Math.min(v.courts,Math.floor(n/2));
  if(K==='mix')return Math.min(v.courts,Math.floor(m/2),Math.floor(f/2));
  return Math.min(v.courts,Math.floor(n/4));
}
function slots(t){return FORMATS[t.type].kind==='team'?2:4;}
function isUpfront(t){return FORMATS[t.type].family==='americano'&&t.roundsMode!=='unlimited';}
function partnerPairsLeft(v){
  const {P}=pairCounts(v),K=FORMATS[v.type].kind;let rem=0;
  if(K==='mix'){const men=v.entries.filter(e=>e.g==='M'),wom=v.entries.filter(e=>e.g==='F');for(const x of men)for(const y of wom)if(!P(x.id,y.id))rem++;}
  else{const ids=v.entries.map(e=>e.id);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)if(!P(ids[i],ids[j]))rem++;}
  return rem;
}
function estGroupRounds(v){
  const k=perRound(v);if(k<1)return 0;
  if(v.roundsMode==='unlimited')return null;
  if(v.roundsMode==='full'&&FORMATS[v.type].family==='americano'){
    if(FORMATS[v.type].kind==='team'){const n=v.entries.length;return Math.max(Math.ceil(n*(n-1)/2/k),n%2?n:n-1);}
    return Math.ceil(Math.ceil(partnerPairsLeft(v)/2)/k);
  }
  return (+v.roundsN||6)+(+v.extra||0);
}
function plannedRounds(t){
  if(isUpfront(t))return t.rounds.length;
  if(t.roundsMode==='unlimited')return null;
  return (+t.roundsN||6)+(+t.extra||0);
}

/* ---------- Scoring & standings ---------- */
function matchResult(t,m){
  if(t.scoring==='gs'){
    let sa=0,sb=0,ga=0,gb=0,any=false;
    for(const s of (m.sets||[])){const a=num(s[0]),b=num(s[1]);if(a===null||b===null)continue;any=true;ga+=a;gb+=b;if(a>b)sa++;else if(b>a)sb++;}
    return any?{sa,sb,ga,gb}:null;
  }
  const a=num(m.sa),b=num(m.sb);if(a===null||b===null)return null;return {sa:a,sb:b,ga:a,gb:b};
}
function started(t,m){return t.scoring==='gs'?(m.sets||[]).some(s=>s[0]!==''||s[1]!==''):(m.sa!==''&&m.sa!=null)||(m.sb!==''&&m.sb!=null);}
function roundComplete(t,r){return !!r&&r.matches.every(m=>matchResult(t,m));}
function computeStats(t,sortBy,g){
  const F=FORMATS[t.type],map={};
  const ents=g===undefined?t.entries:t.entries.filter(e=>(e.grp||0)===g);
  for(const e of ents)map[e.id]={id:e.id,name:e.name,g:e.g,grp:e.grp||0,away:!!e.away,played:0,w:0,d:0,l:0,pf:0,pa:0,base:0,bonus:0,comp:0,total:0,diff:0,form:[]};
  for(const r of t.rounds){
    for(const m of r.matches){
      const res=matchResult(t,m);if(!res)continue;
      const k=groupCourts(t,m.grp||0),local=m.court-courtOffset(t,m.grp||0);
      const draw=res.sa===res.sb,winA=res.sa>res.sb;
      [[m.a,res.ga,res.gb,winA],[m.b,res.gb,res.ga,!winA&&!draw]].forEach(([ids,forG,agG,won])=>{
        for(const id of ids){
          const s=map[id];if(!s)continue;
          s.played++;s.pf+=forG;s.pa+=agG;
          if(draw){s.d++;s.form.push('t');}else if(won){s.w++;s.form.push('w');}else{s.l++;s.form.push('l');}
          s.base+=matchPts(t)?(draw?t.gsDraw:won?t.gsWin:0):forG;
          if(F.koth&&won)s.bonus+=Math.max(0,k-1-local)*2;
        }
      });
    }
  }
  const list=Object.values(map);
  if(t.comp&&t.scoring!=='gs'){
    const val=s=>matchPts(t)?s.base:s.pf;
    const maxP=Math.max(0,...list.map(s=>s.played));
    const tp=list.reduce((a,s)=>a+s.played,0),avgAll=tp?list.reduce((a,s)=>a+val(s),0)/tp:0;
    for(const s of list)if(s.played<maxP){const avg=s.played?val(s)/s.played:avgAll;s.comp=Math.round(avg*(maxP-s.played));}
  }
  for(const s of list){s.total=s.base+s.bonus+s.comp;s.diff=s.pf-s.pa;s.wr=s.played?s.w/s.played:0;}
  const by=sortBy||t.sortBy,tie=(a,b)=>b.diff-a.diff||a.name.localeCompare(b.name);
  list.sort(by==='wins'?(a,b)=>b.w-a.w||b.diff-a.diff||b.total-a.total||a.name.localeCompare(b.name)
    :(a,b)=>b.total-a.total||b.w-a.w||tie(a,b));
  return list;
}

/* ---------- Schedule generation (works on one group's view) ---------- */
function appear(v){const c={};for(const r of v.rounds)for(const m of r.matches)for(const id of [...m.a,...m.b])c[id]=(c[id]||0)+1;return c;}
function pairCounts(v){
  const partner={},opp={},key=(x,y)=>x<y?x+'|'+y:y+'|'+x,inc=(o,k)=>o[k]=(o[k]||0)+1;
  for(const r of v.rounds)for(const m of r.matches){
    if(m.a.length===2){inc(partner,key(m.a[0],m.a[1]));inc(partner,key(m.b[0],m.b[1]));}
    for(const x of m.a)for(const y of m.b)inc(opp,key(x,y));
  }
  return {P:(x,y)=>partner[key(x,y)]||0,O:(x,y)=>opp[key(x,y)]||0};
}
/* Priority for a court slot: fewest matches first, then whoever has rested longest since their last match */
function lastPlayed(v){const l={};v.rounds.forEach((r,i)=>r.matches.forEach(m=>[...m.a,...m.b].forEach(id=>l[id]=i)));return l;}
function pick(ids,ap,n,keep,last){
  last=last||{};
  const arr=(keep?ids.slice():shuffle(ids)).map((id,i)=>({id,i}));
  arr.sort((x,y)=>(ap[x.id]||0)-(ap[y.id]||0)||(last[x.id]??-1)-(last[y.id]??-1)||x.i-y.i);
  return arr.slice(0,n).map(x=>x.id);
}
function blank(t,matches){matches.forEach(m=>{if(t.scoring==='gs')m.sets=[['',''],['',''],['','']];else{m.sa='';m.sb='';}});return matches;}
function withBye(t,matches){const inM=new Set(matches.flatMap(m=>[...m.a,...m.b]));return {matches:blank(t,matches),bye:present(t).map(e=>e.id).filter(id=>!inM.has(id))};}
function genCore(v,isLast){
  const F=FORMATS[v.type],first=!v.rounds.some(r=>r.matches.length),keep=first&&v.order==='keep';
  if(F.koth&&!first){const r=kothNext(v);if(r)return r;}
  let k=perRound(v);if(k<1)return {matches:[],bye:v.entries.map(e=>e.id)};
  const ap=appear(v),lp=lastPlayed(v),rank={};
  if(F.mex&&!first)computeStats(v,'points').forEach((s,i)=>rank[s.id]=i);
  const byRank=(x,y)=>(rank[x]??999)-(rank[y]??999);
  const {P,O}=pairCounts(v);
  const cost=(a,b)=>10*P(a[0],a[1])+10*P(b[0],b[1])+a.reduce((s,x)=>s+b.reduce((u,y)=>u+O(x,y),0),0);
  if(isLast&&v.courtUsage==='fewer'&&v.roundsMode==='full'&&F.family==='americano'&&F.kind!=='team')k=Math.max(1,Math.min(k,Math.ceil(partnerPairsLeft(v)/2)));
  let matches=[];
  if(F.kind==='team'){
    const sel=pick(v.entries.map(x=>x.id),ap,k*2,keep,lp);let pairs=[];
    if(F.mex&&!first){sel.sort(byRank);for(let i=0;i<k;i++)pairs.push([sel[2*i],sel[2*i+1]]);}
    else if(keep){for(let i=0;i<k;i++)pairs.push([sel[2*i],sel[2*i+1]]);}
    else{let bc=Infinity;for(let z=0;z<80;z++){const s=shuffle(sel),ps=[];let c=0;for(let i=0;i<k;i++){ps.push([s[2*i],s[2*i+1]]);c+=O(s[2*i],s[2*i+1]);}if(c<bc){bc=c;pairs=ps;}}}
    matches=pairs.map(([x,y],i)=>({court:i,a:[x],b:[y]}));
  }else if(F.kind==='mix'){
    const men=v.entries.filter(p=>p.g==='M').map(p=>p.id),wom=v.entries.filter(p=>p.g==='F').map(p=>p.id);
    const sm=pick(men,ap,2*k,keep,lp),sw=pick(wom,ap,2*k,keep,lp);
    if(F.mex&&!first){sm.sort(byRank);sw.sort(byRank);for(let i=0;i<k;i++)matches.push({court:i,a:[sm[2*i],sw[2*i+1]],b:[sm[2*i+1],sw[2*i]]});}
    else if(keep){for(let i=0;i<k;i++)matches.push({court:i,a:[sm[2*i],sw[2*i]],b:[sm[2*i+1],sw[2*i+1]]});}
    else{let bc=Infinity;for(let z=0;z<100;z++){const m1=shuffle(sm),w1=shuffle(sw),ms=[];let c=0;
      for(let i=0;i<k;i++){const o1={a:[m1[2*i],w1[2*i]],b:[m1[2*i+1],w1[2*i+1]]},o2={a:[m1[2*i],w1[2*i+1]],b:[m1[2*i+1],w1[2*i]]};
        const c1=cost(o1.a,o1.b),c2=cost(o2.a,o2.b);c+=Math.min(c1,c2);ms.push({court:i,...(c1<=c2?o1:o2)});}
      if(c<bc){bc=c;matches=ms;}}}
  }else{
    const sel=pick(v.entries.map(p=>p.id),ap,4*k,keep,lp);
    if(F.mex&&!first){sel.sort(byRank);for(let i=0;i<k;i++){const g=sel.slice(4*i,4*i+4);matches.push({court:i,a:[g[0],g[3]],b:[g[1],g[2]]});}}
    else if(keep){for(let i=0;i<k;i++){const g=sel.slice(4*i,4*i+4);matches.push({court:i,a:[g[0],g[1]],b:[g[2],g[3]]});}}
    else{let bc=Infinity;for(let z=0;z<150;z++){const s=shuffle(sel),ms=[];let c=0;
      for(let i=0;i<k;i++){const g=s.slice(4*i,4*i+4);
        const opts=[[[g[0],g[1]],[g[2],g[3]]],[[g[0],g[2]],[g[1],g[3]]],[[g[0],g[3]],[g[1],g[2]]]];
        let bo=null,bcc=Infinity;for(const [a,b] of opts){const cc=cost(a,b);if(cc<bcc){bcc=cc;bo={a,b};}}
        c+=bcc;ms.push({court:i,...bo});}
      if(c<bc){bc=c;matches=ms;}}}
  }
  return withBye(v,matches);
}
/* King of the Court: winners move up, losers move down. Returns null when the roster changed, so a fresh draw is used. */
function kothNext(v){
  let prev=null;for(let i=v.rounds.length-1;i>=0;i--)if(v.rounds[i].matches.length){prev=v.rounds[i];break;}
  if(!prev)return null;
  const ids=new Set(v.entries.map(e=>e.id)),k=perRound(v);
  const ms=prev.matches.slice().sort((a,b)=>a.court-b.court);
  if(ms.length!==k||ms.some(m=>[...m.a,...m.b].some(id=>!ids.has(id))))return null;
  const W=[],L=[];
  ms.forEach(m=>{const r=matchResult(v,m)||{sa:1,sb:0},aWin=r.sa>=r.sb;W.push(aWin?m.a:m.b);L.push(aWin?m.b:m.a);});
  const courts=[];
  for(let i=0;i<k;i++){if(k===1)courts.push([W[0],L[0]]);else if(i===0)courts.push([W[0],W[1]]);else if(i===k-1)courts.push([L[k-2],L[k-1]]);else courts.push([L[i-1],W[i+1]]);}
  const inPrev=new Set(ms.flatMap(m=>[...m.a,...m.b]));
  const ap=appear(v),lp=lastPlayed(v);
  const bye=pick(v.entries.map(e=>e.id).filter(id=>!inPrev.has(id)),ap,999,true,lp);
  /* Resting players come in first: each takes the slot of a losing player who has played the most (winners keep their court) */
  const lineup=courts.map(([X,Y])=>[X.slice(),Y.slice()]),winners=new Set(W.flat()),locked=new Set();
  for(const e of bye){
    let best=null;
    lineup.forEach((side,ci)=>side.forEach((pair,si)=>pair.forEach((id,pi)=>{if(winners.has(id)||locked.has(id))return;const c=ap[id]||0;
      if(!best||c>best.c||(c===best.c&&(lp[id]??-1)>(lp[best.id]??-1)))best={id,c,ci,si,pi};})));
    if(!best||best.c<(ap[e]||0))break;
    lineup[best.ci][best.si][best.pi]=e;locked.add(e);
  }
  return withBye(v,lineup.map(([X,Y],i)=>({court:i,a:[X[0],Y[0]],b:[X[1],Y[1]]})));
}
/* Team round robin over the pairs that have not met yet, spreading games evenly */
function teamRoundRobin(v){
  const ids=v.entries.map(e=>e.id),k=perRound(v);if(k<1)return [];
  const {O}=pairCounts(v),ap=appear(v);let best=null,bestScore=Infinity;
  for(let att=0;att<80;att++){
    let pairs=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)if(!O(ids[i],ids[j]))pairs.push([ids[i],ids[j]]);
    if(!(v.order==='keep'&&att===0))pairs=shuffle(pairs);
    const games={};ids.forEach(i=>games[i]=ap[i]||0);const rounds=[];
    while(pairs.length){
      const used=new Set(),ms=[],taken=new Set();
      const order=pairs.map((p,i)=>({p,i,s:games[p[0]]+games[p[1]]})).sort((x,y)=>x.s-y.s||x.i-y.i);
      for(const o of order){if(ms.length>=k)break;const [x,y]=o.p;if(used.has(x)||used.has(y))continue;used.add(x);used.add(y);ms.push(o.p);taken.add(o.i);}
      pairs=pairs.filter((_,i)=>!taken.has(i));
      if(v.courtUsage==='all'&&ms.length<k){const free=ids.filter(i=>!used.has(i)).sort((x,y)=>games[x]-games[y]);while(free.length>=2&&ms.length<k)ms.push([free.shift(),free.shift()]);}
      ms.forEach(([x,y])=>{games[x]++;games[y]++;});
      rounds.push(ms);
    }
    const g=Object.values(games),score=rounds.length*100+(g.length?Math.max(...g)-Math.min(...g):0);
    if(score<bestScore){bestScore=score;best=rounds;}
  }
  return best.map(ms=>withBye(v,ms.map(([x,y],i)=>({court:i,a:[x],b:[y]}))));
}
function mergeGroup(t,g,r,into){r.matches.forEach(m=>into.push({...m,grp:g,court:m.court+courtOffset(t,g)}));}
/* One new round for every group (used by Mexicano, KOTH, extra rounds) */
function nextRound(t,isLast){
  const ms=[];
  for(let g=0;g<G(t);g++){const v=genView(t,g);if(perRound(v)<1)continue;mergeGroup(t,g,genCore(v,isLast),ms);}
  if(!ms.length)throw new Error('Peserta yang hadir belum cukup untuk membuat match.');
  return withBye(t,ms);
}
/* Fill the remaining Americano rounds after the rounds kept so far */
function fillUpfront(t){
  const kept=t.rounds.length,per=[];
  for(let g=0;g<G(t);g++){
    const v=genView(t,g),k=perRound(v);if(k<1){per.push([]);continue;}
    let out=[];
    if(t.roundsMode==='full'&&FORMATS[t.type].kind==='team')out=teamRoundRobin(v);
    else{
      const R=t.roundsMode==='full'?Math.ceil(Math.ceil(partnerPairsLeft(v)/2)/k):Math.max(0,(+t.target||0)-kept);
      for(let i=0;i<R;i++){const r=genCore(v,i===R-1);v.rounds.push(r);out.push(r);}
    }
    per.push(out);
  }
  const L=Math.max(0,...per.map(a=>a.length));
  for(let i=0;i<L;i++){const ms=[];per.forEach((arr,g)=>{if(arr[i])mergeGroup(t,g,arr[i],ms);});t.rounds.push(withBye(t,ms));}
  if(t.roundsMode==='full')t.target=t.rounds.length;

}
function buildSchedule(t){
  t.rounds=[];
  if(isUpfront(t)){if(t.roundsMode!=='full')t.target=(+t.roundsN||6);fillUpfront(t);if(!t.rounds.length)throw new Error('Peserta belum cukup untuk membuat jadwal.');}
  else t.rounds.push(nextRound(t,false));
}
/* After attendance or roster changes: keep rounds that have started, rebuild the rest */
/* Replace only the absent players in an unstarted round with players who are present and resting.
   Everyone else keeps their court, partner and opponents. */
function patchRound(t,ri){
  const r=t.rounds[ri],F=FORMATS[t.type],ent=id=>t.entries.find(e=>e.id===id);
  const ap={};t.rounds.forEach((x,i)=>{if(i!==ri)x.matches.forEach(m=>[...m.a,...m.b].forEach(id=>ap[id]=(ap[id]||0)+1));});
  const lp={};t.rounds.forEach((x,i)=>{if(i<ri)x.matches.forEach(m=>[...m.a,...m.b].forEach(id=>lp[id]=i));});
  const swaps=[];
  const inRound=()=>new Set(r.matches.flatMap(m=>[...m.a,...m.b]));
  for(const m of r.matches){
    if(started(t,m))continue;
    for(const side of ['a','b'])for(let i=0;i<m[side].length;i++){
      const id=m[side][i],e=ent(id);if(e&&!e.away)continue;
      const used=inRound();
      const cand=t.entries.filter(c=>!c.away&&!used.has(c.id)&&(G(t)===1||(c.grp||0)===((e&&e.grp)||0))&&(F.kind!=='mix'||!e||c.g===e.g))
        .sort((x,y)=>(ap[x.id]||0)-(ap[y.id]||0)||(lp[x.id]??-1)-(lp[y.id]??-1)||x.name.localeCompare(y.name));
      if(cand.length){m[side][i]=cand[0].id;swaps.push([e?e.name:'?',cand[0].name]);}
      else swaps.push([e?e.name:'?',null]);
    }
  }
  /* A match that still has an absent player and no replacement is dropped; its present players rest. */
  r.matches=r.matches.filter(m=>started(t,m)||[...m.a,...m.b].every(id=>{const e=ent(id);return e&&!e.away;}));
  const used=inRound();r.bye=present(t).map(e=>e.id).filter(id=>!used.has(id));
  return swaps;
}
function reschedule(t){
  let last=-1;t.rounds.forEach((r,i)=>{if(r.matches.some(m=>started(t,m)))last=i;});
  let swaps=[],patched=-1;
  const cur=last+1<t.rounds.length?last+1:-1;
  if(last>=0&&t.rounds[last].matches.some(m=>!started(t,m))){swaps=patchRound(t,last);patched=last;}
  if(cur>=0){swaps=swaps.concat(patchRound(t,cur));patched=cur;}
  const keep=Math.max(last,patched)+1;const before=t.rounds.length;t.rounds=t.rounds.slice(0,keep);
  if(isUpfront(t)){fillUpfront(t);}
  else if(!t.rounds.length){if(!t.finished)t.rounds.push(nextRound(t,false));}
  if(!t.rounds.length)t.rounds.push({matches:[],bye:present(t).map(e=>e.id)});
  return {swaps,patched,rebuiltFrom:isUpfront(t)&&t.rounds.length>keep?keep+1:null,to:t.rounds.length};
}

/* ---------- Draft / tournament creation ---------- */
function newDraft(){return {name:'',type:'americano',date:nowLocal(),courts:2,groups:1,scoring:'point',total:21,entries:[],roundsMode:'full',roundsN:6,courtUsage:'fewer',sortBy:'points',order:'random',comp:true,hidePublic:false,gsWin:3,gsDraw:1,sim:null};}
function assignGroups(entries,n,random){
  const list=(random?shuffle(entries):entries.slice());let i=0;
  [...list.filter(e=>e.g==='M'),...list.filter(e=>e.g!=='M')].forEach(e=>{e.grp=n>1?(i++%n):0;});
}
function fromDraft(d,randomGroups){
  const t={id:uid(),name:d.name.trim()||('Main Padel '+fmtDate(d.date)),type:d.type,date:d.date,courts:d.courts,groups:Math.max(1,+d.groups||1),scoring:d.scoring,
    total:d.scoring==='gs'?null:+d.total,roundsMode:d.roundsMode,roundsN:+d.roundsN,courtUsage:d.courtUsage,sortBy:d.sortBy,order:d.order,
    comp:d.comp,hidePublic:d.hidePublic,gsWin:+d.gsWin||3,gsDraw:+d.gsDraw||0,extra:0,target:0,
    entries:d.entries.map(e=>({id:e.id,name:e.name,g:e.g,grp:0,away:false})),rounds:[],finished:false,created:Date.now()};
  assignGroups(t.entries,t.groups,randomGroups);
  return t;
}
function draftSig(d){return JSON.stringify([d.type,d.courts,d.groups,d.entries.map(e=>e.id+e.g),d.roundsMode,d.roundsN,d.courtUsage,d.order,d.scoring]);}
function validateT(t){
  const F=FORMATS[t.type];
  if(t.courts<G(t))return `Jumlah lapangan (${t.courts}) harus minimal sama dengan jumlah grup (${G(t)}).`;
  for(let g=0;g<G(t);g++){
    const v=genView(t,g),{n,m,f}=counts(v),pre=G(t)>1?grpName(g)+' ':'';
    if(F.kind==='team'&&n<2)return pre+'butuh minimal 2 tim.';
    if(F.kind==='mix'&&(m<2||f<2))return (pre||'Mix ')+'butuh minimal 2 putra dan 2 putri. Ketuk label Putra/Putri untuk mengubah.';
    if(F.kind==='ind'&&n<4)return (pre||'Turnamen ')+'butuh minimal 4 pemain.';
  }
  return '';
}
function validate(d){if(!d.entries.length)return `Tambahkan ${FORMATS[d.type].kind==='team'?'tim':'pemain'} dulu.`;return validateT(fromDraft(d,false));}
function createFromDraft(d){
  let t;
  if(isUpfront(d)&&d.sim&&d.sim.sig===draftSig(d)){
    t=fromDraft(d,false);const grp={};d.sim.entries.forEach(e=>grp[e.id]=e.grp);t.entries.forEach(e=>e.grp=grp[e.id]??0);
    t.rounds=d.sim.rounds.map(r=>({matches:blank(t,r.matches.map(m=>({court:m.court,grp:m.grp||0,a:m.a.slice(),b:m.b.slice()}))),bye:r.bye.slice()}));
    t.target=t.rounds.length;
  }else{t=fromDraft(d,d.order==='random');buildSchedule(t);}
  return t;
}
function makeSample(){
  const d=newDraft();
  d.name='[Chapter 3] Teman Main Padelmu';d.type='team-americano';d.scoring='normal';d.total=4;d.date='2026-10-18T16:00';
  d.entries=['Debiy & Frans','Mira & GusSus','Ula & Satrio','RDA & RM','Icha & Wisnu','Nopita & Hodam'].map(n=>({id:uid(),name:n,g:'M'}));
  const t=createFromDraft(d);t.sample=true;
  const res=[[3,1],[2,2],[4,0],[1,3],[3,1],[2,2],[3,1],[0,4],[4,0],[2,2]];let i=0;
  t.rounds.slice(0,5).forEach(r=>r.matches.forEach(m=>{const s=res[i++%res.length];m.sa=String(s[0]);m.sb=String(s[1]);}));
  return t;
}
function migrate(){
  S.wheels=S.wheels||[];
  for(const t of S.tournaments){t.groups=t.groups||1;t.extra=t.extra||0;if(!t.target)t.target=t.rounds.length;t.entries.forEach(e=>{e.grp=e.grp||0;e.away=!!e.away;});t.rounds.forEach(r=>r.matches.forEach(m=>m.grp=m.grp||0));}
}

function estimateHtml(d){
  const t=fromDraft(d,false),F=FORMATS[t.type];
  if(validate(d))return `<div class="est"><span class="lbl">Estimasi</span><p class="help">Lengkapi ${F.kind==='team'?'tim':'pemain'}${G(t)>1?' di setiap grup':''} dulu untuk melihat estimasi ronde dan pembagian main.</p></div>`;
  let R=0,unl=false,k=0,slotsSum=0;
  for(let g=0;g<G(t);g++){const v=genView(t,g),r=estGroupRounds(v),kk=perRound(v);if(r===null)unl=true;else{R=Math.max(R,r);slotsSum+=r*kk*slots(t);}k+=kk;}
  let info;
  if(t.roundsMode==='full'&&F.family==='americano')info=F.kind==='team'?'Semua tim saling bertemu':F.kind==='mix'?'Setiap putra berpasangan dengan setiap putri':'Setiap pemain berpasangan dengan semua pemain';

  else info=F.mex?'Lawan tiap ronde disusun dari klasemen':F.koth?'Posisi lapangan berubah sesuai hasil':'Partner dan lawan dirotasi';
  if(G(t)>1)info+=` di dalam masing-masing dari ${G(t)} grup`;
  const per=unl?0:slotsSum/t.entries.length,perTxt=unl?'–':(Number.isInteger(per)?per:'±'+per.toFixed(1).replace('.',','));
  const dur=unl?null:R*MIN_PER_ROUND;
  return `<div class="est"><div class="spread"><span class="lbl">Estimasi</span><span class="big">${unl?'Tanpa batas':'~ '+R+' ronde'}</span></div>
    <p class="help" style="color:var(--cream)">${info}</p>
    <div class="facts"><div class="fact"><b>${k}</b><span>Lapangan/ronde</span></div><div class="fact"><b>${perTxt}</b><span>Main per ${unitWord(t)}</span></div><div class="fact"><b>${dur?(dur>=60?Math.floor(dur/60)+'j '+(dur%60?dur%60+'m':''):dur+'m'):'–'}</b><span>Durasi*</span></div></div>
    <p class="help">*Asumsi ${MIN_PER_ROUND} menit per ronde.</p>
    <button type="button" class="btn primary sm" style="align-self:flex-end" data-act="sim">${I.flask}Simulasi</button></div>`;
}

function actionsHtml(t){

  if(confirmKey==='extra')return `<div class="extra"><b>Tambah ronde ekstra</b><p class="help">Slot lapangan diisi dulu oleh yang paling sedikit main. Kalau jumlah mainnya sama, yang paling lama istirahat didahulukan.</p>${priorityHtml(t)}

  }else h+=`<div class="row"><button class="btn ghost" data-act="extra">+ Ronde ekstra</button><button class="btn primary" data-act="finish" ${allDone?'':'disabled'}>Selesai</button></div>`;
  return h;

function priorityHtml(t){

const FB_CFG={apiKey:"AIzaSyCWwyOOyFcXWYqwoaq1y6z_a-Vo4cMaPeM",authDomain:"temanmainpadelmu.firebaseapp.com",projectId:"temanmainpadelmu",storageBucket:"temanmainpadelmu.firebasestorage.app",messagingSenderId:"762166045173",appId:"1:762166045173:web:10c12b40aa0b1c27fcd8bc"};
const FB_V='10.12.2',FB_URL=n=>`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${n}.js`;
const Live={base:null,authP:null,uid:null,pushed:{},timer:null,chain:Promise.resolve(),warned:false,
  async core(){
    if(!this.base)this.base=(async()=>{const [a,f]=await Promise.all([import(FB_URL('app')),import(FB_URL('firestore'))]);const app=a.initializeApp(FB_CFG);return {app,f,db:f.getFirestore(app)};})();

  async owner(){

    try{return await this.authP;}catch(e){this.authP=null;throw e;}
  },
  ref(c,id){return c.f.doc(c.db,'live',id);},
  async push(t){
    const c=await this.core();await this.owner();
    const j=JSON.stringify(t);
    await c.f.setDoc(this.ref(c,t.liveId),{owner:t.liveOwner||this.uid,json:j,name:String(t.name).slice(0,120),updated:Date.now()});
    this.pushed[t.liveId]=j;
  },
  schedule(){
    if(!STANDALONE)return;

    this.timer=setTimeout(()=>{this.chain=this.chain.then(async()=>{
      for(const t of S.tournaments){if(!t.liveId)continue;const j=JSON.stringify(t);if(this.pushed[t.liveId]===j)continue;

          if(code==='permission-denied'&&!this.warned){this.warned=true;toast('Link live hanya bisa di-update dari HP yang membuatnya');}}
      }});},700);
  },
  watch(id){
    return this.core().then(c=>c.f.onSnapshot(this.ref(c,id),{includeMetadataChanges:true},snap=>{
      if(!snap.exists()){liveT=null;liveState='gone';render();return;}
      try{liveT=JSON.parse(snap.data().json);}catch(e){return;}

  }

/* ---------- Replace a player who has not arrived (any unstarted match) ---------- */
let swapCtx=null;
/* Only Mexicano round 1: later rounds are built from the standings, so they follow normal Mexicano rules */
const canSwap=(t,ri)=>ri===0&&!!FORMATS[t.type].mex;
function findIn(r,id){let loc=null;r.matches.forEach((mm,j)=>['a','b'].forEach(sd=>mm[sd].forEach((x,p)=>{if(x===id)loc={j,sd,p};})));return loc;}
function openSwap(ri,mi,side,pi){
  const t=cur(),m=t.rounds[ri].matches[mi];if(!canSwap(t,ri))return;
  if(started(t,m)){toast('Skor match ini sudah diisi, jadi pemainnya tidak bisa diganti');return;}
  swapCtx={ri,mi,side,pi,id:m[side][pi],absent:true};renderSwap();
}
function openSwapPick(ri,mi){
  const t=cur(),m=t.rounds[ri].matches[mi];if(!canSwap(t,ri))return;
  if(started(t,m)){toast('Skor match ini sudah diisi, jadi pemainnya tidak bisa diganti');return;}
  const row=side=>m[side].map((id,pi)=>`<button type="button" class="prow pick" data-act="swap" data-r="${ri}" data-m="${mi}" data-side="${side}" data-pi="${pi}"><span class="nm">${esc(eName(t,id))}</span><span class="chip">${I.pencil} Ganti</span></button>`).join('');
  openSheet('swap',`<div><h2 style="font-weight:700;font-size:20px">Siapa yang belum datang?</h2>
      <p class="help">Ronde ${ri+1} · ${G(t)>1?grpName(m.grp||0)+' · ':''}Lapangan ${courtName(m.court)}. Pilih ${unitWord(t)} yang mau diganti.</p></div>
    <div class="elist">${row('a')}<p class="help" style="text-align:center;margin:2px 0">vs</p>${row('b')}</div>
    <button class="btn ghost block" data-act="sheetclose">Batal</button>`);
}
function swapCandidates(t,ctx){
  const r=t.rounds[ctx.ri],old=t.entries.find(e=>e.id===ctx.id),F=FORMATS[t.type],ap=appear(t);
  const rest=[],swap=[];
  for(const e of t.entries){
    if(e.id===ctx.id||e.away)continue;
    if(G(t)>1&&(e.grp||0)!==(old.grp||0))continue;
    if(F.kind==='mix'&&e.g!==old.g)continue;
    const loc=findIn(r,e.id);
    if(!loc)rest.push({e,c:ap[e.id]||0});
    else if(!(loc.j===ctx.mi&&loc.sd===ctx.side)&&!started(t,r.matches[loc.j]))swap.push({e,loc});
  }
  rest.sort((x,y)=>x.c-y.c||x.e.name.localeCompare(y.e.name));
  return {rest,swap};
}
function renderSwap(){
  const t=cur(),ctx=swapCtx,r=t.rounds[ctx.ri],m=r.matches[ctx.mi],F=FORMATS[t.type],old=t.entries.find(e=>e.id===ctx.id);
  const {rest,swap}=swapCandidates(t,ctx),u=unitWord(t);
  openSheet('swap',`<div><h2 style="font-weight:700;font-size:20px">Ganti ${esc(old.name)}</h2>
      <p class="help">Ronde ${ctx.ri+1} · ${G(t)>1?grpName(m.grp||0)+' · ':''}Lapangan ${courtName(m.court)}${F.kind==='mix'?` · hanya ${old.g==='M'?'putra':'putri'}`:''}</p></div>
    <label class="check"><input type="checkbox" id="swap-absent" ${ctx.absent?'checked':''}><span><b>Tandai ${esc(old.name)} belum datang</b><span class="help">Tidak dijadwalkan sampai ditandai Hadir lagi di Peserta & kehadiran. Poin kompensasi (+M) menutup match yang terlewat.</span></span></label>
    <div class="field"><span class="lbl">Sudah datang & sedang istirahat</span>
      ${rest.length?`<div class="elist">${rest.map(x=>`<button type="button" class="prow pick" data-act="swapdo" data-id="${x.e.id}"><span class="nm">${esc(x.e.name)}</span><span class="chip">${x.c}x main</span></button>`).join('')}</div>`
        :`<p class="note">Tidak ada ${u} yang sedang istirahat. Tukar dengan yang ada di lapangan lain, atau tambahkan ${u} baru.</p>`}</div>
    ${swap.length?`<div class="field"><span class="lbl">Tukar posisi dengan lapangan lain</span><p class="help">${esc(old.name)} pindah ke posisi ${u} yang dipilih. Cocok kalau dia sudah dalam perjalanan dan bisa main di lapangan yang mulai belakangan.</p>
      <div class="elist">${swap.map(x=>{const mm=r.matches[x.loc.j];return `<button type="button" class="prow pick" data-act="swapdo" data-id="${x.e.id}"><span class="nm">${esc(x.e.name)}</span><span class="chip">Lap. ${courtName(mm.court)}${x.loc.j===ctx.mi?' · lawan':''}</span></button>`;}).join('')}</div></div>`:''}
    <button class="btn ghost block" data-act="roster">${I.people} Tambah ${u} baru / atur kehadiran</button>
    <button class="btn ghost block" data-act="sheetclose">Batal</button>`);
}
function doSwap(cid){
  const t=cur(),ctx=swapCtx;if(!t||!ctx)return;
  const r=t.rounds[ctx.ri],m=r.matches[ctx.mi],old=t.entries.find(e=>e.id===ctx.id),nu=t.entries.find(e=>e.id===cid);
  const absentEl=document.getElementById('swap-absent');if(absentEl)ctx.absent=absentEl.checked;
  const loc=findIn(r,cid);let msg;
  if(loc){
    r.matches[loc.j][loc.sd][loc.p]=ctx.id;m[ctx.side][ctx.pi]=cid;
    msg=`${old.name} ditukar dengan ${nu.name}`;
  }else{
    m[ctx.side][ctx.pi]=cid;r.bye=r.bye.filter(id=>id!==cid&&id!==ctx.id);
    if(ctx.absent)old.away=true;else r.bye.push(ctx.id);
    msg=`${nu.name} main menggantikan ${old.name}`+(ctx.absent?' · ditandai belum datang':'');
    if(ctx.absent&&isUpfront(t)){
      let last=ctx.ri;t.rounds.forEach((x,i)=>{if(i>ctx.ri&&x.matches.some(mm=>started(t,mm)))last=i;});
      t.rounds=t.rounds.slice(0,last+1);try{fillUpfront(t);}catch(e){}
      msg+=' · ronde berikutnya disusun ulang';
    }
  }
  swapCtx=null;save();closeSheet();render();toast(msg);
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
async function logoPng(){return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;c.getContext('2d').drawImage(img,0,0,160,160);try{res(c.toDataURL('image/png'));}catch(e){res(null);}};img.onerror=()=>res(null);img.src=LOGO_SRC;});}
async function buildPdf(t){
  if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),F=FORMATS[t.type];
  const W=210,M=14,BR=[15,42,92],TAN=[170,196,245],INK=[14,27,58],MUT=[91,107,135],LINE=[214,224,240];
  const clean=s=>String(s).replace(/[^\x20-\x7E -ÿ–—·•]/g,'');
  let y=0;
  const header=()=>{doc.setFillColor(...BR);doc.rect(0,0,W,30,'F');if(logo)doc.addImage(logo,'PNG',M,5,20,20);
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(doc.splitTextToSize(clean(t.name),W-M*2-26)[0],M+25,14);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...TAN);doc.text(clean(`${F.label} · ${fmtDate(t.date)} · ${totalLabel(t)} · ${t.entries.length} ${unitWord(t)} · ${t.courts} lapangan${G(t)>1?' · '+G(t)+' grup':''}`),M+25,21);y=40;};
  const need=h=>{if(y+h>285){doc.addPage();header();}};
  const logo=await logoPng();header();
  const h2=s=>{need(14);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...INK);doc.text(clean(s),M,y);y+=7;};
  if(t.finished){
    const champs=G(t)===1?[['Juara',computeStats(t)[0]]]:Array.from({length:G(t)},(_,g)=>['Juara '+grpName(g),computeStats(t,null,g)[0]]);
    champs.forEach(([lbl,s])=>{if(!s)return;need(14);doc.setFillColor(...TAN);doc.roundedRect(M,y-5,W-M*2,11,2,2,'F');doc.setTextColor(...INK);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(clean(`${lbl}: ${s.name}  (${s.total} poin, ${s.w} menang)`),M+4,y+2);y+=15;});
  }
  if(privateNow(t)){h2('Klasemen');doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...MUT);doc.text('Klasemen dirahasiakan sampai turnamen selesai.',M,y);y+=10;}
  else{
    const cols=[['#',8],[F.kind==='team'?'Tim':'Pemain',78],['G',14],['M-K-S',24],['Diff',18],['+M',16],['P',24]];
    const table=(st,title)=>{h2(title);need(10);let x=M;doc.setFillColor(...BR);doc.rect(M,y-4.5,W-M*2,7,'F');doc.setFontSize(8.5);doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');
      cols.forEach(([c,w],i)=>{doc.text(c,i<2?x+1.5:x+w/2,y,{align:i<2?'left':'center'});x+=w;});y+=7;
      st.forEach((s,i)=>{need(8);x=M;if(i<3&&s.played){doc.setFillColor(...[[248,236,206],[240,237,232],[246,229,214]][i]);doc.rect(M,y-4.5,W-M*2,7,'F');}
        doc.setDrawColor(...LINE);doc.line(M,y+2.5,W-M,y+2.5);doc.setTextColor(...INK);doc.setFont('helvetica',i<3&&s.played?'bold':'normal');doc.setFontSize(9.5);
        const vals=[String(i+1),clean(s.name)+(s.away?' (absen)':''),String(s.played),`${s.w}-${s.l}-${s.d}`,String(s.diff),String(s.comp),String(s.total)];
        cols.forEach(([c,w],j)=>{const v=j===1?doc.splitTextToSize(vals[j],w-3)[0]:vals[j];doc.text(v,j<2?x+1.5:x+w/2,y,{align:j<2?'left':'center'});x+=w;});y+=7;});
      y+=6;};
    if(G(t)===1)table(computeStats(t),'Klasemen');else for(let g=0;g<G(t);g++)table(computeStats(t,null,g),'Klasemen '+grpName(g));
  }
  h2('Hasil per ronde');
  t.rounds.forEach((r,i)=>{if(!r.matches.length)return;need(8+r.matches.length*6);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...INK);doc.text(`Ronde ${i+1}`,M,y);y+=5.5;
    r.matches.forEach(m=>{const res=matchResult(t,m);const sc=res?(t.scoring==='gs'?m.sets.filter(s=>s[0]!==''&&s[1]!=='').map(s=>s[0]+'-'+s[1]).join(', '):`${res.ga} - ${res.gb}`):'belum main';
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MUT);doc.text(clean(`${G(t)>1?grpName(m.grp||0)+' · ':''}Lap. ${courtName(m.court)}`),M+2,y);
      doc.setTextColor(...INK);doc.text(doc.splitTextToSize(clean(sideName(t,m.a)),62)[0],M+30,y);doc.setFont('helvetica','bold');doc.text(sc,M+104,y,{align:'center'});doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(clean(sideName(t,m.b)),62)[0],M+120,y);y+=5.5;});
    y+=2;});
  const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(...MUT);doc.text(`TMP · Teman Main Padelmu  ·  Halaman ${p}/${pages}`,W/2,292,{align:'center'});}
  return doc.output('blob');
}
async function exportPdf(){
  const t=cur();menuOpen=false;render();
  const dl=window.claude?.use?await window.claude.use('downloads'):null;
  toast('Menyiapkan PDF…');
  let blob;try{blob=await buildPdf(t);}catch(e){toast('PDF gagal dibuat. Periksa koneksi internet lalu coba lagi.');return;}
  const fname=(t.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'turnamen')+'.pdf';
  if(!dl){
    /* Standalone website: native share sheet (iPhone/Android), otherwise a normal download */
    try{const file=new File([blob],fname,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:t.name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('PDF diunduh');}
    catch(e){toast('PDF tidak bisa diunduh di browser ini');}
    return;
  }
  try{const r=await dl.save({filename:fname,data:blob});if(r.status==='saved')toast('PDF siap dibagikan');}
  catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'Tunggu sebentar lalu coba lagi':'PDF tidak bisa diunduh di tampilan ini');}
}

const WCOL=[['#1F5FE0','#FFFFFF'],['#E8EFFB','#0E1B3A'],['#4C82EC','#FFFFFF'],['#FFFFFF','#1F5FE0'],['#0F2A5C','#FFFFFF'],['#BFD3F7','#0E1B3A']];
function drawWheel(){
  const w=wheelObj(),cv=document.getElementById('wcanvas');if(!w||!cv)return;
  const ctx=cv.getContext('2d'),S2=cv.width,R=S2/2-8,n=Math.max(1,w.items.length),seg=2*Math.PI/n,rot=(spin&&spin.rot)||w.rot||0;
  ctx.clearRect(0,0,S2,S2);ctx.save();ctx.translate(S2/2,S2/2);
  ctx.beginPath();ctx.arc(0,0,R+6,0,2*Math.PI);ctx.fillStyle='#1F5FE0';ctx.fill();
  if(!w.items.length){ctx.beginPath();ctx.arc(0,0,R,0,2*Math.PI);ctx.fillStyle='#EEF3FC';ctx.fill();ctx.restore();return;}
  ctx.rotate(rot);
  for(let i=0;i<n;i++){
    const [bg,fg]=WCOL[(n%WCOL.length===1&&i===n-1)?2:i%WCOL.length];
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,-Math.PI/2+i*seg,-Math.PI/2+(i+1)*seg);ctx.closePath();ctx.fillStyle=bg;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.rotate(-Math.PI/2+(i+.5)*seg);ctx.fillStyle=fg;ctx.textAlign='right';ctx.textBaseline='middle';
    const fs=Math.max(16,Math.min(34,Math.floor(seg*R*.42)));ctx.font=`700 ${fs}px Figtree, system-ui, sans-serif`;
    let label=w.items[i];const maxW=R*.62;while(ctx.measureText(label).width>maxW&&label.length>2)label=label.slice(0,-2)+'…';
    ctx.fillText(label,R-22,0);ctx.restore();
  }
  ctx.restore();
}
function doSpin(){
  const w=wheelObj();if(!w||w.items.length<2||spin)return;
  const n=w.items.length,seg=2*Math.PI/n,idx=Math.floor(Math.random()*n),a=idx*seg+seg*(.15+.7*Math.random());
  const start=w.rot||0,TAU=2*Math.PI,base=((-a-start)%TAU+TAU)%TAU,end=start+TAU*6+base;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,dur=reduce?500:4200,t0=performance.now();
  spin={rot:start};document.getElementById('wspin').disabled=true;
  document.getElementById('wresult').innerHTML='<span class="hand">Memutar…</span>';
  const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);spin.rot=start+(end-start)*e;drawWheel();
    if(p<1){requestAnimationFrame(step);return;}
    w.rot=end%TAU;spin=null;const win=w.items[idx];w.last=win;(w.hist=w.hist||[]).push(win);
    let extra='';if(w.removeWinner){w.items.splice(idx,1);extra=`<span class="help">Dihapus dari roda. Sisa ${w.items.length} pilihan.</span>`;}
    save();document.getElementById('wresult').innerHTML=`<span class="hand">Terpilih</span><span class="pill">${esc(win)}</span>${extra}`;
    if(w.removeWinner){const ta=document.getElementById('w-items');if(ta)ta.value=w.items.join('\n');const lb=document.querySelector('label[for="w-items"]');if(lb)lb.textContent=`Pilihan (${w.items.length})`;}
    document.getElementById('wspin').disabled=w.items.length<2;drawWheel();};
  requestAnimationFrame(step);
}
function wheelFromTournament(){

  let w=S.wheels.find(x=>x.src===t.id);const items=present(t).map(e=>e.name).slice(0,60);
  if(!w){w={id:uid(),src:t.id,name:t.name+' · Peserta',items,removeWinner:false,hist:[],rot:0};S.wheels.unshift(w);}else w.items=items;
  save();curWheel=w.id;prevView='tour';view='wheel';confirmKey=null;render();window.scrollTo(0,0);

function goView(v){if(spin)return;view=v;menuOpen=false;confirmKey=null;render();window.scrollTo(0,0);}

document.addEventListener('click',e=>{
  userNavigated=true;
  if(menuOpen&&!e.target.closest('.menu')){menuOpen=false;render();if(!e.target.closest('[data-act],[data-tab]'))return;}
  const el=e.target.closest('[data-act],[data-seg],[data-tab]');if(!el)return;
  if(view==='live'){
    if(el.dataset.tab){tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
    const a=el.dataset.act,t=liveT;if(!t)return;
    if(a==='rgo'){selRound=+el.dataset.i;liveFollow=false;render();}
    else if(a==='rprev'){selRound=Math.max(0,selRound-1);liveFollow=false;render();}
    else if(a==='rnext'){selRound=Math.min(t.rounds.length-1,selRound+1);liveFollow=false;render();}
    else if(a==='livefollow'){liveFollow=true;followRound();render();}
    return;
  }
  if(el.dataset.seg){const k=el.dataset.seg,v=el.dataset.val;draft[k]=v;if(k==='scoring')draft.total=v==='point'?21:v==='normal'?4:null;draft.sim=null;render();return;}
  if(el.dataset.tab){tab=el.dataset.tab;confirmKey=null;render();window.scrollTo(0,0);return;}
  const act=el.dataset.act,t=cur();
  switch(act){
    case 'back':goBack();break;
    case 'new':draft=newDraft();formErr='';editingId=null;goView('create');break;
    case 'hidehint':S.hideHint=true;save();render();break;
    case 'open':curId=el.dataset.id;tab='rounds';{const tt=cur();const firstOpen=tt.rounds.findIndex(r=>!roundComplete(tt,r));selRound=firstOpen<0?tt.rounds.length-1:firstOpen;}goView('tour');break;
    case 'court-':draft.courts=Math.max(1,draft.courts-1);if(draft.groups>draft.courts)draft.groups=draft.courts;draft.sim=null;render();break;
    case 'court+':draft.courts=Math.min(MAX_COURTS,draft.courts+1);draft.sim=null;render();break;
    case 'grp-':draft.groups=Math.max(1,draft.groups-1);draft.sim=null;render();break;
    case 'grp+':draft.groups=draft.groups+1;if(draft.courts<draft.groups)draft.courts=draft.groups;draft.sim=null;render();break;
    case 'adde':addEntries();break;
    case 'rme':draft.entries=draft.entries.filter(x=>x.id!==el.dataset.id);draft.sim=null;render();break;
    case 'edit':editingId=el.dataset.id;render();{const i=document.getElementById('edit-input');if(i){i.focus();i.select();}}break;
    case 'gtog':{const p=draft.entries.find(x=>x.id===el.dataset.id);p.g=p.g==='M'?'F':'M';draft.sim=null;render();break;}
    case 'sim':openSim();break;
    case 'sheetclose':closeSheet();break;
    case 'reshuffle':{const k=sim.k;openSim();if(sim)setSimK(Math.min(k,sim.t.rounds.length));toast('Jadwal diacak ulang');break;}
    case 'simplay':toggleSimPlay();break;
    case 'menu':menuOpen=!menuOpen;render();break;
    case 'roster':openRoster();break;
    case 'swap':openSwap(+el.dataset.r,+el.dataset.m,el.dataset.side,+el.dataset.pi);break;
    case 'swapdo':doSwap(el.dataset.id);break;
    case 'swappick':openSwapPick(+el.dataset.r,+el.dataset.m);break;
    case 'live':menuOpen=false;render();openLiveSheet();break;
    case 'liveon':liveOn();break;
    case 'liveoff':liveOff();break;
    case 'livecopy':{const inp=document.getElementById('livelink');const url=inp.value;try{navigator.clipboard.writeText(url).then(()=>toast('Link disalin'),()=>{inp.select();toast('Ketuk lama lalu Copy');});}catch(err){inp.select();}break;}
    case 'patt':{const x=t.entries.find(y=>y.id===el.dataset.id);x.away=!x.away;rosterDirty=true;save();rosterRerender();break;}
    case 'pgtog':{const x=t.entries.find(y=>y.id===el.dataset.id);x.g=x.g==='M'?'F':'M';rosterDirty=true;save();rosterRerender();break;}
    case 'pdel':{t.entries=t.entries.filter(y=>y.id!==el.dataset.id);t.rounds.forEach(r=>{r.bye=r.bye.filter(id=>id!==el.dataset.id);});
      if(inAnyMatch(t,el.dataset.id))rosterDirty=true;else rosterDirty=rosterDirty||false;rosterDirty=true;save();rosterRerender();break;}
    case 'padd':{const ta=document.getElementById('r-entry'),F=FORMATS[t.type],names=parseNames(ta.value,F.kind==='team');if(!names.length){ta.focus();break;}
      names.forEach(n=>{const sizes=Array.from({length:G(t)},(_,g)=>t.entries.filter(x=>(x.grp||0)===g).length);const grp=sizes.indexOf(Math.min(...sizes));const {m,f}=counts({type:t.type,entries:t.entries});
        t.entries.push({id:uid(),name:n,g:F.kind==='mix'?(m<=f?'M':'F'):'M',grp,away:false});});
      rosterDirty=true;save();rosterRerender();document.getElementById('r-entry')?.focus();toast(names.length+' '+unitWord(t)+' ditambahkan');break;}
    case 'pdf':exportPdf();break;
    case 'togglepriv':t.hidePublic=!t.hidePublic;menuOpen=false;save();render();toast(t.hidePublic?'Klasemen privat aktif':'Klasemen privat dimatikan');break;
    case 'wheel-from':wheelFromTournament();break;
    case 'rgo':selRound=+el.dataset.i;render();break;
    case 'rprev':selRound=Math.max(0,selRound-1);render();break;
    case 'rnext':selRound=Math.min(t.rounds.length-1,selRound+1);render();break;
    case 'next':try{t.rounds.push(nextRound(t,false));selRound=t.rounds.length-1;save();render();window.scrollTo(0,0);toast('Ronde '+t.rounds.length+' siap dimainkan');}catch(err){toast(err.message);}break;
    case 'extra':confirmKey='extra';extraN=1;document.getElementById('ractions').innerHTML=actionsHtml(t);break;
    case 'ex-':extraN=Math.max(1,extraN-1);document.getElementById('ractions').innerHTML=actionsHtml(t);break;
    case 'ex+':extraN=Math.min(20,extraN+1);document.getElementById('ractions').innerHTML=actionsHtml(t);break;
    case 'extra-yes':confirmKey=null;try{
      if(isUpfront(t)){const first=t.rounds.length;for(let i=0;i<extraN;i++)t.rounds.push(nextRound(t,false));t.target=t.rounds.length;selRound=first;}
      else{t.extra=(+t.extra||0)+extraN;}
      save();render();
      if(isUpfront(t)){const ap=appear(t),c=present(t).map(e=>ap[e.id]||0);toast(`${extraN} ronde ekstra ditambahkan · main ${Math.min(...c)}–${Math.max(...c)}x`);}
      else toast(extraN+' ronde ekstra ditambahkan, yang paling sedikit main didahulukan');}catch(err){toast(err.message);render();}break;
    case 'undo':confirmKey='undo';document.getElementById('ractions').innerHTML=actionsHtml(t);break;
    case 'undo-yes':confirmKey=null;t.rounds.pop();selRound=t.rounds.length-1;save();render();toast('Ronde dibatalkan');break;
    case 'finish':confirmKey='finish';document.getElementById('ractions').innerHTML=actionsHtml(t);break;
    case 'finish-yes':confirmKey=null;t.finished=true;save();render();window.scrollTo(0,0);toast('Turnamen selesai');break;
    case 'cancel':confirmKey=null;render();break;
    case 'reopen':t.finished=false;menuOpen=false;save();render();break;
    case 'askdel':menuOpen=false;confirmKey='del';render();window.scrollTo(0,0);break;
    case 'del-yes':S.tournaments=S.tournaments.filter(x=>x.id!==t.id);(S.deleted=S.deleted||[]).push(t.id);save();toast('Turnamen dihapus');goView('home');break;
    case 'wheels':prevView='home';goView('wheels');break;
    case 'wnew':{S.wheels=S.wheels||[];const w={id:uid(),name:'Roda baru',items:['Servis duluan','Pilih sisi','Traktir minum','Push up 10x'],removeWinner:false,hist:[],rot:0};S.wheels.unshift(w);save();curWheel=w.id;prevView='wheels';goView('wheel');break;}
    case 'wopen':curWheel=el.dataset.id;prevView='wheels';goView('wheel');break;
    case 'wspin':doSpin();break;
    case 'wdel':confirmKey='wdel';render();break;
    case 'wdel-yes':S.wheels=S.wheels.filter(w=>w.id!==curWheel);(S.deleted=S.deleted||[]).push(curWheel);save();goView('wheels');break;
    case 'copy':{const txt=shareText(t);menuOpen=false;
      const fb=()=>{render();const box=document.getElementById('copyfallback');if(!box)return;box.innerHTML=`<textarea class="input copyarea" id="copytxt" readonly>${esc(txt)}</textarea><p class="help">Teks sudah dipilih. Ketuk lama lalu pilih Copy.</p>`;const a=document.getElementById('copytxt');a.focus();a.select();};
      try{navigator.clipboard.writeText(txt).then(()=>{render();toast('Klasemen disalin');},fb);}catch(err){fb();}break;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(view==='create'&&draft&&el.dataset&&el.dataset.k){draft[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;return;}
  if(el.id==='simrange'&&sim){stopSim();const b=document.getElementById('simplay');if(b)b.innerHTML=I.play+'Putar';setSimK(+el.value);return;}
  if(el.dataset&&el.dataset.pid){const t=cur(),x=t.entries.find(y=>y.id===el.dataset.pid);if(x&&el.value.trim()){x.name=el.value.trim().slice(0,48);save();}return;}
  if(el.id==='w-name'){const w=wheelObj();w.name=el.value.slice(0,60)||'Roda';save();return;}
  if(el.id==='w-items'){const w=wheelObj();w.items=el.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,60);save();drawWheel();
    const lb=document.querySelector('label[for="w-items"]');if(lb)lb.textContent=`Pilihan (${w.items.length})`;const b=document.getElementById('wspin');if(b&&!spin)b.disabled=w.items.length<2;return;}
  if(el.classList&&(el.classList.contains('sbox')||el.classList.contains('sset'))&&el.dataset.r!==undefined){
    const t=cur(),m=t.rounds[+el.dataset.r].matches[+el.dataset.m],side=el.dataset.side,o=side==='a'?'b':'a';
    const v=el.value.replace(/[^0-9]/g,'').slice(0,2);if(v!==el.value)el.value=v;
    if(t.scoring==='gs'){m.sets[+el.dataset.set][side==='a'?0:1]=v;}
    else{
      m['s'+side]=v;
      if(t.total&&v!==''&&+v<=t.total){m['s'+o]=String(t.total-+v);el.closest('.mcard').querySelector(`.sbox[data-side="${o}"]`).value=m['s'+o];}
      else if(t.total&&v===''){m['s'+o]='';el.closest('.mcard').querySelector(`.sbox[data-side="${o}"]`).value='';}
    }
    save();refreshLive(el.closest('.mcard'));
  }
});
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;
  if(view==='create'&&draft){
    if(id==='f-type'){draft.type=v;if(FORMATS[v].family!=='americano'&&draft.roundsMode==='full')draft.roundsMode='n';formErr='';draft.sim=null;render();}
    else if(id==='f-total'){draft.total=+v;draft.sim=null;render();}
    else if(id==='f-rounds'){if(v==='full'||v==='unlimited')draft.roundsMode=v;else{draft.roundsMode='n';draft.roundsN=+v;}draft.sim=null;render();}
    else if(id==='f-court'){draft.courtUsage=v;draft.sim=null;render();}
    else if(id==='f-sort'){draft.sortBy=v;render();}
    else if(id==='f-nocomp'){draft.comp=!e.target.checked;}
    else if(e.target.name==='order'){draft.order=v;draft.sim=null;render();}
  }
  if(e.target.dataset&&e.target.dataset.pgrp){const t=cur(),x=t.entries.find(y=>y.id===e.target.dataset.pgrp);x.grp=+v;rosterDirty=true;save();rosterRerender();}
  if(id==='w-remove'){const w=wheelObj();w.removeWinner=e.target.checked;save();}
  if(id==='lb-sort'&&cur()){cur().sortBy=v;save();render();}
});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('adv')&&draft)draft.advOpen=e.target.open;},true);
document.addEventListener('focusout',e=>{if(e.target.id==='edit-input')commitEdit();});
document.addEventListener('keydown',e=>{
  if(e.target.id==='f-entry'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();addEntries();}
  if(e.target.id==='r-entry'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('[data-act="padd"]').click();}
  if(e.target.id==='edit-input'&&e.key==='Enter'){e.preventDefault();e.target.blur();}
  if(e.target.dataset&&e.target.dataset.pid&&e.key==='Enter'){e.preventDefault();e.target.blur();}
  if(e.key==='Escape'&&sheetKind)closeSheet();
});
document.addEventListener('submit',e=>{
  e.preventDefault();if(view!=='create')return;
  if(document.getElementById('f-entry')?.value.trim())addEntries();
  formErr=validate(draft);if(formErr){render();document.querySelector('.err')?.scrollIntoView({block:'center'});return;}
  try{const t=createFromDraft(draft);S.tournaments.push(t);save();curId=t.id;tab='rounds';selRound=0;goView('tour');toast('Jadwal siap, selamat main!');}
  catch(err){formErr=err.message;render();}
});

/* ---------- Boot ---------- */
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.tournaments))S=s;}}catch(e){}
migrate();
if(!S.seeded){S.seeded=true;localSave();}
function enterLiveFromHash(){
  const m=/^#live-([a-z0-9]{6,20})$/.exec(location.hash);
  if(!m)return false;
  liveViewId=m[1];view='live';tab='rounds';liveT=null;liveState='connecting';liveFollow=true;
  Live.watch(liveViewId).catch(()=>{liveState='error';render();});
  return true;
}
if(!enterLiveFromHash())restoreLast();
render();
if(view!=='live')Cloud.init();
window.addEventListener('hashchange',()=>{if(enterLiveFromHash())render();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')Cloud.schedule(0);else Cloud.refresh();});
window.addEventListener('pagehide',()=>Cloud.schedule(0));
</script>
